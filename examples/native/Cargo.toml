[package]
name = "bffi-example-native"
description = "Example native module for bffi-rs: the first real cdylib loaded by Bun through bun:ffi."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
# cdylib is the Bun-loaded artifact; rlib lets the tests/ integration
# suite link the crate for the bffi_meta descriptor aggregation.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
bffi = { path = "../../crates/bffi" }
# The macro expansions name these absolute paths: keep them as direct deps.
bffi-core = { path = "../../crates/bffi-core" }
bffi-types = { path = "../../crates/bffi-types" }
bffi-dts = { path = "../../crates/bffi-dts" }
bffi-macros = { path = "../../crates/bffi-macros" }
bffi-build = { path = "../../crates/bffi-build" }
bffi-object = { path = "../../crates/bffi-object" }
bffi-class = { path = "../../crates/bffi-class" }
bffi-async = { path = "../../crates/bffi-async" }
bffi-callback = { path = "../../crates/bffi-callback" }
bffi-event-loop = { path = "../../crates/bffi-event-loop" }
