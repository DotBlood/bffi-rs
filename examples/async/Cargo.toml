[package]
name = "bffi-example-async"
description = "Example bffi-rs native module: the async surface (Rust futures as JS Promises, cancellation, timeouts), doubling as the e2e test of the .bffi pipeline."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
# Writes .bffi/bffi.api.json from module_def::MODULE (the loader JSON
# artifact consumed by the @z2net/bffi pipeline).
name = "emit-json"
path = "src/bin/emit_json.rs"

[lints]
workspace = true

[dependencies]
bffi = { path = "../../crates/bffi", features = ["macros", "async"] }
bffi-macros = { path = "../../crates/bffi-macros" }
