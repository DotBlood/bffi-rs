# Publishes the @z2net/bffi-native-* platform packages when a GitHub
# release is published (a release implies the v* tag). The cdylibs are
# built per-platform, assembled with `bffi pack`, and published with
# the NPM_TOKEN repository secret.
#
# One-time setup (repository settings):
#   Secrets -> Actions -> NPM_TOKEN : an npm automation token with
#   access to the @z2net scope.
name: release-npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   triple: win32-x64-msvc,   artifact: bffi_native.dll }
          - { os: ubuntu-latest,    triple: linux-x64-gnu,    artifact: libbffi_native.so }
          - { os: ubuntu-latest,    triple: linux-x64-musl,   artifact: libbffi_native.so,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, triple: linux-arm64-gnu,  artifact: libbffi_native.so }
          - { os: ubuntu-24.04-arm, triple: linux-arm64-musl, artifact: libbffi_native.so,  target: aarch64-unknown-linux-musl }
          - { os: macos-13,         triple: darwin-x64,       artifact: libbffi_native.dylib }
          - { os: macos-latest,     triple: darwin-aarch64,   artifact: libbffi_native.dylib }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up the pinned Rust toolchain
        run: rustup toolchain install

      - name: Add the cross target (musl triples)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Build the release cdylib
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p bffi-native --target ${{ matrix.target }}
          else
            cargo build --release -p bffi-native
          fi

      - name: Assemble the platform package (bffi pack)
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            ARTIFACT="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          else
            ARTIFACT="target/release/${{ matrix.artifact }}"
          fi
          bun packages/bffi-cli/bin/bffi.ts pack \
            --src "$ARTIFACT" \
            --triple ${{ matrix.triple }} \
            --name @z2net/bffi-native \
            --binary bffi_native \
            --out platform

      - name: Publish the platform package
        if: matrix.triple != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not configured - skipping the publish (configure the repository secret to enable it)."
            exit 1
          fi
          cd platform/bffi-native-${{ matrix.triple }}
          npm publish --access public

  publish-main:
    # The @z2net/bffi-native main package: pinned optionalDependencies
    # point at the platform packages above, so it goes LAST.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Publish the main package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not configured - skipping the publish (configure the repository secret to enable it)."
            exit 1
          fi
          cd packages/native
          npm publish --access public
