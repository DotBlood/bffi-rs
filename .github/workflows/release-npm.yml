# Publishes every npm package of the repository when a GitHub release
# is published (a release implies the v* tag), in the dependency-safe
# order:
#
#   1. the seven @z2net/bffi-native-<triple> platform packages
#      (cdylib built per-OS, assembled with `bffi pack`);
#   2. the @z2net/bffi-native main package (its optionalDependencies
#      point at the platform packages above);
#   3. @z2net/bffi (the loader/pipeline);
#   4. @z2net/bffi-cli (depends on @z2net/bffi).
#
# One-time setup (repository settings):
#   Secrets -> Actions -> NPM_TOKEN : an npm automation token with
#   access to the @z2net scope. npm authentication follows the
#   canonical pattern: actions/setup-node with registry-url writes
#   the .npmrc, npm publish authenticates through NODE_AUTH_TOKEN.
name: release-npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   triple: win32-x64-msvc,   artifact: bffi_native.dll }
          - { os: ubuntu-latest,    triple: linux-x64-gnu,    artifact: libbffi_native.so }
          - { os: ubuntu-latest,    triple: linux-x64-musl,   artifact: libbffi_native.so,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, triple: linux-arm64-gnu,  artifact: libbffi_native.so }
          - { os: ubuntu-24.04-arm, triple: linux-arm64-musl, artifact: libbffi_native.so,  target: aarch64-unknown-linux-musl }
          - { os: macos-13,         triple: darwin-x64,       artifact: libbffi_native.dylib }
          - { os: macos-latest,     triple: darwin-aarch64,   artifact: libbffi_native.dylib }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up the pinned Rust toolchain
        run: rustup toolchain install

      - name: Add the cross target (musl triples)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Build the release cdylib
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p bffi-native --target ${{ matrix.target }}
          else
            cargo build --release -p bffi-native
          fi

      - name: Assemble the platform package (bffi pack)
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            ARTIFACT="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          else
            ARTIFACT="target/release/${{ matrix.artifact }}"
          fi
          bun packages/bffi-cli/bin/bffi.ts pack \
            --src "$ARTIFACT" \
            --triple ${{ matrix.triple }} \
            --name @z2net/bffi-native \
            --binary bffi_native \
            --out platform

      # Canonical npm authentication: setup-node + registry-url writes
      # the .npmrc, NODE_AUTH_TOKEN authenticates the publish.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish the platform package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured - add the repository secret to enable publishing."
            exit 1
          fi
          cd platform/bffi-native-${{ matrix.triple }}
          npm publish --access public

  publish-native-main:
    needs: build-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @z2net/bffi-native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured - add the repository secret to enable publishing."
            exit 1
          fi
          cd packages/native
          npm publish --access public

  publish-bffi:
    needs: publish-native-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @z2net/bffi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured - add the repository secret to enable publishing."
            exit 1
          fi
          cd packages/bffi
          npm publish --access public

  publish-bffi-cli:
    needs: publish-bffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @z2net/bffi-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured - add the repository secret to enable publishing."
            exit 1
          fi
          cd packages/bffi-cli
          npm publish --access public
