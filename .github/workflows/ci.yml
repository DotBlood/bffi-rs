name: CI

# CI parity with `bun run ci`, spread across the operating systems the
# foundation is expected to support. The macOS runner is arm64, which
# exercises the aarch64 NEON UTF-8 validation path.
on:
  # every pull request is checked regardless of its target branch (stacked
  # feature PRs must be validated too); pushes are limited to the mainlines
  pull_request:
  push:
    branches: [main, dev/main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (debug)
        run: cargo test --workspace

      # release configuration on one OS keeps the matrix cheap while still
      # covering the optimized build of the lock-free and SIMD code
      - name: cargo test (release)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --release

      # the tokio opt-in feature of bffi-async: keep the gated code
      # compiling and tested (one OS keeps the matrix cheap)
      - name: cargo test bffi-async (tokio feature)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo clippy -p bffi-async --features tokio --all-targets -- -D warnings
          cargo test -p bffi-async --features tokio

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: bun install
        run: bun install --frozen-lockfile

      - name: oxlint
        run: bun run lint

      - name: tsc
        run: bun run typecheck

      - name: bun unit tests (packages, bin)
        run: bun test packages bin

      # the first real bun:ffi crossing: build the release cdylib and
      # run the e2e suite against it (ubuntu: .so artifact)
      - name: cargo build (release, example)
        run: bun run build

      - name: bun test (native e2e)
        run: bun test examples/native

      # native-template pack smoke: the pattern-A packaging script must
      # assemble a valid platform package from the built artifact
      - name: native-template pack smoke
        run: bun packages/native-template/scripts/pack-platforms.ts --src target/release/libbffi_example_native.so --triple linux-x64-gnu

      # sequential e2e: sticky JS-thread bind + pump-driven async
      # delivery race other files under the parallel runner, so these
      # run in their own pass (env-gated in the test file itself)
      - name: bun test (sequential e2e)
        run: bun test generated-sequential
        env:
          BFFI_SEQUENTIAL_E2E: "1"
