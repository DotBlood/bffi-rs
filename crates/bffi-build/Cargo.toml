[package]
name = "bffi-build"
description = "Runtime C ABI layer for bffi-rs: JS-facing exports for errors and transient buffers, generated in the user crate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
bffi-core = { path = "../bffi-core" }
# Layering: build sits above dts (no cycle); bffi-dts stays pure.
bffi-dts = { path = "../bffi-dts" }
bffi-error = { path = "../bffi-error" }
bffi-types = { path = "../bffi-types" }

[dev-dependencies]
# Test-only: the loader-JSON tests parse the emitted bytes back.
serde_json = "1"
