[package]
name = "bffi-async"
description = "Promise / async support for bffi-rs: spawn Rust futures from JS as Promises, with cancellation and timeouts, resolved through the event loop."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
bffi-core = { path = "../bffi-core" }
bffi-event-loop = { path = "../bffi-event-loop" }
bffi-types = { path = "../bffi-types" }
bffi-build = { path = "../bffi-build" }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "rt-multi-thread", "time", "net", "sync"] }

[features]
default = []
tokio = ["dep:tokio"]
